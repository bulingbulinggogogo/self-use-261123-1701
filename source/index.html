function field(label,name,value='',type='text',wide=false,required=true){return `<label class="field ${wide?'wide':''}"><span>${label}${required?' <span style="color:#d96868">*</span>':''}</span><input class="input" name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" max="9999"':''} maxlength="150"></label>`}

function details(id){let x=data[page].find(x=>x.id===id);const info=(l,v)=>`<div><small>${l}</small>${esc(v)}</div>`;let body=`<div class="detail-hero">${page==='books'?cover(x):`<span class="school-icon" style="width:56px;height:65px">${icon(page==='school'?'school':'headphones')}</span>`}<div><h2>${esc(x.name)}</h2><p class="muted" style="font-size:11px;margin:7px 0">${esc(x.id)}</p>${pill(x.status)}</div></div><div class="detail-grid">${info('学科 / 年级',x.subject+' · '+x.grade)}${info('负责人',x.owner)}${info('更新日期',x.date)}${info(page==='books'?'教材版本':page==='school'?'所属学校':'口音',page==='books'?x.version:page==='school'?x.school:x.accent)}${page!=='listening'?info('内容单元',x.count+' 个'):info('所属书籍',x.book)}</div>`;if(page==='school')body+=`<div class="detail-box">编写进度：${x.progress}%<br>流程：草稿 → 编写中 → 待审核 → 已发布</div>`;if(page==='books')body+=`<div class="detail-box">内容规划<br>本产品包含 ${x.count} 个内容单元，面向${esc(x.grade)}学生，配合${esc(x.version)}教学进度使用。</div>`;if(page==='listening')body+=`<div class="audio-area"><strong style="font-size:12px">录音试听</strong><p class="muted" style="font-size:11px;margin-top:5px">选择本地音频试听，关闭后不保留。</p><input type="file" id="audio-file" accept="audio/*" aria-label="选择本地录音"><audio id="audio" controls hidden></audio><div class="error" id="audio-error"></div></div>${['transcript','translation','analysis'].map((k,i)=>`<h3 style="margin-top:22px">${['录音稿','中文翻译','题目解析'][i]}</h3><div class="detail-box" style="margin-top:9px">${esc(x[k]||'待补充')}</div>`).join('')}`;openDialog('内容详情',body,`<button class="btn" data-close>关闭</button><button class="btn primary" id="detail-edit">编辑内容</button>`);$('#detail-edit').onclick=()=>{closeDialog();editItem(id)};if($('#audio-file'))$('#audio-file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(f);$('#audio').src=audioUrl;$('#audio').hidden=false;$('#audio-error').textContent='';$('#audio').onerror=()=>$('#audio-error').textContent='无法播放此文件，请选择浏览器支持的 MP3 function exportCSV(onlySelected=false){const rows=filtered().filter(x=>!onlySelected||selected.has(x.id));if(!rows.length){toast('没有可导出的内容');return}const columns=page==='books'?[['id','编号'],['name','名称'],['subject','学科'],['grade','年级'],['version','版本'],['count','内容单元'],['status','状态'],['owner','负责人'],['date','更新日期']]:page==='school'?[['id','编号'],['name','名称'],['school','学校'],['subject','学科'],['grade','年级'],['progress','进度'],['status','状态'],['owner','负责人']]:[['id','编号'],['name','名称'],['book','所属书籍'],['accent','口音'],['status','状态'],['transcript','录音稿'],['translation','翻译'],['analysis','解析']];const cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv='\ufeff'+[columns.map(c=>cell(c[1])).join(','),...rows.map(r=>columns.map(c=>cell(r[c[0]])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=titles[page]+'-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`已导出 ${rows.length} 项内容`)}

function renderDepartments(){

document.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>page==='accounts'?editSimpleAccount(b.dataset.member):editMember(b.dataset.member));document.querySelectorAll('[data-reset-password]').forEach(b=>b.onclick=()=>resetMemberPassword(b.dataset.resetPassword));document.querySelectorAll('[data-personal-permissions]').forEach(b=>b.onclick=()=>editPersonalPermissions(b.dataset.personalPermissions));
document.querySelectorAll('[data-toggle-account]').forEach(b=>b.onclick=()=>toggleAccountStatus(b.dataset.toggleAccount));
}
function editSimpleAccount(id){
 const original=data.members.find(m=>m.id===id);
 const choices=new Set(original?.departments||((data.departments.some(d=>d.id===departmentFilter))?[departmentFilter]:[])),chosenParents=new Set();
 for(const id of choices){const department=data.departments.find(d=>d.id===id);if(department)chosenParents.add(department.parentId||department.id)}
 for(const id of [...choices])if(data.departments.some(d=>d.parentId===id&&choices.has(d.id)))choices.delete(id);
 openDialog(original?'修改账号':'新增账号',`<form id="simple-account-form">${field('姓名','name',original?.name||'','text',true)}<div class="row" style="margin-bottom:10px"><strong>所属部门 <span style="color:#d96868">*</span></strong></div><div class="membership-options" id="membership-options"></div><div id="membership-summary" class="muted" style="font-size:12px;margin-top:10px"></div><p class="error" id="simple-account-error" role="alert"></p></form>`,'<button class="btn" data-close>取消</button><button class="btn primary" form="simple-account-form" type="submit">保存</button>');
 function drawChoices(){
const parents=data.departments.filter(d=>!d.parentId);
$('#membership-options').innerHTML=parents.length?parents.map(parent=>{const enabled=chosenParents.has(parent.id),children=data.departments.filter(d=>d.parentId===parent.id);return `<div class="membership-family"><label class="membership-option"><input type="checkbox" data-parent-choice="${esc(parent.id)}" ${enabled?'checked':''}><span>${esc(parent.name)}</span></label>${enabled&&children.length?`<div class="membership-children">${children.map(child=>`<label class="membership-option"><input type="checkbox" data-child-choice="${esc(child.id)}" data-parent-id="${esc(parent.id)}" ${choices.has(child.id)?'checked':''}><span>${esc(child.name)}</span></label>`).join('')}</div>`:''}</div>`}).join(''):'<p class="muted" style="padding:16px">未找到部门</p>';
$('#membership-summary').textContent=choices.size?'已选择：'+data.departments.filter(d=>choices.has(d.id)).map(d=>departmentPath(d.id)).join('、'):'请至少选择一个部门';
$('#membership-options').querySelectorAll('[data-parent-choice]').forEach(c=>c.onchange=()=>{const id=c.dataset.parentChoice;if(c.checked){chosenParents.add(id);choices.add(id)}else{chosenParents.delete(id);choices.delete(id);data.departments.filter(d=>d.parentId===id).forEach(d=>choices.delete(d.id))}drawChoices()});
$('#membership-options').querySelectorAll('[data-child-choice]').forEach(c=>c.onchange=()=>{const id=c.dataset.childChoice,parentId=c.dataset.parentId;if(!chosenParents.has(parentId))return;if(c.checked)choices.add(id);else choices.delete(id);if(data.departments.some(d=>d.parentId===parentId&&choices.has(d.id)))choices.delete(parentId);else choices.add(parentId);drawChoices()});
}
 drawChoices();
 $('#simple-account-form').onsubmit=e=>{e.preventDefault();const name=e.target.elements.name.value.trim();if(!name){$('#simple-account-error').textContent='请填写姓名';return}if(!choices.size){$('#simple-account-error').textContent='请至少选择一个所属部门';return}const ok=commitWorkspace(d=>{const member=d.members.find(m=>m.id===id);if(member){member.name=name;member.departments=[...choices];member.lastOperationDate=today()}else d.members.push({id:'M-'+crypto.randomUUID(),name,phone:'',departments:[...choices],tags:[],status:'使用中',lastOperationDate:today(),companyId:COMPANY_ID})});if(ok){closeDialog();renderPermissions();toast('账号已保存')}};
}
function editDepartment(parentId=''){
if(parentId&&!data.departments.some(d=>d.id===parentId&&!d.parentId)){toast('只允许在顶级部门下新增一层');return}
openDialog('新增部门 / 项目组',`<form id="department-form">${field('名称','name','','text',true)}<label class="field"><span>上级部门</span><select class="input" name="parentId"><option value="">${esc(data.company.name)}（公司）</option>${orderedDepartments().filter(d=>!d.parentId).map(d=>`<option value="${esc(d.id)}" ${d.id===parentId?'selected':''}>${esc(departmentPath(d.id))}</option>`).join('')}</select></label><p class="error" id="department-error" role="alert"></p></form>`,'<button class="btn" data-close>取消</button><button class="btn primary" form="department-form" type="submit">保存</button>');
$('#department-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),parentId=f.get('parentId'),kind=parentId?'子部门':'部门';if(parentId&&!data.departments.some(d=>d.id===parentId&&!d.parentId)){$('#department-error').textContent='只允许在顶级部门下新增一层';return}if(!name){$('#department-error').textContent='请输入名称';return}if(data.departments.some(d=>d.name.toLowerCase()===name.toLowerCase()&&(d.parentId||'')===parentId)){$('#department-error').textContent='同一上级下已存在该名称';return}const id='D-'+crypto.randomUUID();data.departments.push({id,name,parentId,kind,companyId:COMPANY_ID});collapsedDepartments.delete(COMPANY_ID);collapsedDepartments.delete(parentId);save();closeDialog();departmentFilter=id;departmentQuery='';memberQuery='';memberPage=1;renderPermissions();toast('已添加')};
}

function editMember(id,departmentsOnly=false){
const original=data.members.find(m=>m.id===id);const m=original||{name:'',phone:'',tags:[],departments:data.departments.some(d=>d.id===departmentFilter)?[departmentFilter]:[]};const choices=new Set(m.departments);const chosenParents=new Set();
for(const id of choices){const d=data.departments.find(d=>d.id===id);if(d)chosenParents.add(d.parentId||d.id)}
for(const id of [...choices]){if(data.departments.some(d=>d.parentId===id&&choices.has(d.id)))choices.delete(id)}
openDialog(departmentsOnly?'调整所属部门':id?'修改账号':'新增账号',`<form id="member-form">${departmentsOnly?`<div class="row" style="margin-bottom:22px"><span class="avatar">${esc(m.name.slice(0,1))}</span><div><h3>${esc(m.name)}</h3><small class="muted">${esc(m.phone||'')}</small></div></div>${!m.phone?field('手机号','phone','','tel'):''}`:`<div class="form-grid">${field('姓名','name',m.name)}${field('手机号','phone',m.phone,'tel')}</div>`}<div class="row between" style="margin-bottom:10px"><strong style="font-size:13px;font-weight:500">所属部门 <span style="color:#d96868">*</span></strong></div><div class="membership-options" id="membership-options"></div><div id="membership-summary" class="muted" style="font-size:12px;margin-top:10px"></div><p id="member-error" class="error" role="alert"></p></form>`,'<button class="btn" data-close>取消</button><button class="btn primary" form="member-form" type="submit">保存</button>');
function drawChoices(){
const parents=data.departments.filter(d=>!d.parentId);
$('#membership-options').innerHTML=parents.length?parents.map(parent=>{const enabled=chosenParents.has(parent.id),children=data.departments.filter(d=>d.parentId===parent.id);return `<div class="membership-family"><label class="membership-option"><input type="checkbox" data-parent-choice="${esc(parent.id)}" ${enabled?'checked':''}><span>${esc(parent.name)}</span></label>${enabled&&children.length?`<div class="membership-children">${children.map(child=>`<label class="membership-option"><input type="checkbox" data-child-choice="${esc(child.id)}" data-parent-id="${esc(parent.id)}" ${choices.has(child.id)?'checked':''}><span>${esc(child.name)}</span></label>`).join('')}</div>`:''}</div>`}).join(''):'<p class="muted" style="padding:16px">未找到部门</p>';
$('#membership-summary').textContent=choices.size?'已选择：'+data.departments.filter(d=>choices.has(d.id)).map(d=>departmentPath(d.id)).join('、'):'请至少选择一个部门';
$('#membership-options').querySelectorAll('[data-parent-choice]').forEach(c=>c.onchange=()=>{const id=c.dataset.parentChoice;if(c.checked){chosenParents.add(id);choices.add(id)}else{chosenParents.delete(id);choices.delete(id);data.departments.filter(d=>d.parentId===id).forEach(d=>choices.delete(d.id))}drawChoices()});
$('#membership-options').querySelectorAll('[data-child-choice]').forEach(c=>c.onchange=()=>{const id=c.dataset.childChoice,parentId=c.dataset.parentId;if(!chosenParents.has(parentId))return;if(c.checked)choices.add(id);else choices.delete(id);if(data.departments.some(d=>d.parentId===parentId&&choices.has(d.id)))choices.delete(parentId);else choices.add(parentId);drawChoices()});
}


drawChoices();
$('#member-form').onsubmit=e=>{
e.preventDefault();const fields=new FormData(e.target);let values={departments:[...choices]};
if(!departmentsOnly){values.name=fields.get('name').trim();if(!values.name){$('#member-error').textContent='请输入姓名';return}}
values.phone=(fields.has('phone')?fields.get('phone'):m.phone||'').trim().replace(/[\s-]/g,'');
if(!values.phone){$('#member-error').textContent='请输入手机号';return}
if(!/^\+?[0-9]{7,15}$/.test(values.phone)){$('#member-error').textContent='请输入有效的手机号';return}
if(data.members.some(x=>x.id!==id&&x.phone===values.phone)){$('#member-error').textContent='该手机号已存在';return}
if(!choices.size){$('#member-error').textContent='请至少选择一个所属部门';return}
values.lastOperationDate=today();values.responsibleProjectIds=validResponsibleProjects(values,original?.responsibleProjectIds||[]);if(original)Object.assign(original,values);else data.members.push({...values,id:'U-'+Date.now(),date:today()});save();closeDialog();if(!original){departmentFilter=values.departments[0];departmentQuery='';memberQuery='';memberPage=1}renderPermissions();toast(departmentsOnly?'所属部门已更新':'人员信息已保存')};
}

function resetMemberPassword(id){
const member=data.members.find(m=>m.id===id);if(!member)return;
openDialog('重置密码',`<p>确定重置 <strong>${esc(member.name)}</strong> 的密码吗？</p><p style="margin-top:12px">密码将被重置为 <strong>123456</strong>。</p>`,'<button class="btn" data-close>取消</button><button class="btn primary" id="confirm-password-reset">确认重置</button>');
$('#confirm-password-reset').onclick=()=>{member.passwordResetToDefault=true;member.lastOperationDate=today();save();closeDialog();renderMembers();toast('密码已重置为 123456')};
}
function editProjectLeader(id){
const member=data.members.find(m=>m.id===id);if(!member)return;
const projects=orderedDepartments().filter(d=>member.departments.includes(d.id));const selectedProjects=new Set((member.responsibleProjectIds||[]).filter(id=>projects.some(d=>d.id===id)));
openDialog('将 '+member.name+' 设为负责人',`<form id="project-leader-form"><div id="leader-projects"><div class="membership-options">${projects.length?projects.map(d=>`<label class="membership-option"><input type="checkbox" name="projects" value="${esc(d.id)}" ${selectedProjects.has(d.id)?'checked':''}><span>${esc(departmentPath(d.id))}</span></label>`).join(''):'<p class="muted" style="padding:12px">该人员尚未加入部门或项目组，请先调整所属部门。</p>'}</div></div></form>`,'<button class="btn" data-close>取消</button><button class="btn primary" type="submit" form="project-leader-form">保存</button>');
$('#project-leader-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),ids=validResponsibleProjects(member,f.getAll('projects'));member.responsibleProjectIds=ids;member.lastOperationDate=today();delete member.departmentRoles;save();closeDialog();renderPermissions();toast(ids.length?'负责人设置已保存':'已取消负责人身份')};
}
// Direct grants are stored separately; inheritance and account unions are computed live.
const permissionActions=['查看','新增','编辑','删除','提交审核','审核','发布','导出'];
const permissionModules=[['books','书籍产品'],['school','校本书籍'],['listening','听力教研'],['vocabulary','词库']];
if(!data.departmentPermissions||typeof data.departmentPermissions!=='object'||Array.isArray(data.departmentPermissions))data.departmentPermissions={};
function permissionAncestors(id){const chain=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);if(id===COMPANY_ID){chain.push(id);break}const d=data.departments.find(d=>d.id===id);if(!d)break;chain.push(id);id=d.parentId||COMPANY_ID}return chain}
function directGrants(id){return new Set((Array.isArray(data.departmentPermissions[id])?data.departmentPermissions[id]:[]).filter(k=>permissionModules.some(([m])=>permissionActions.some((_,i)=>k===m+':'+i))))}
function permissionSources(ids){const sources=new Map();for(const id of new Set(ids.flatMap(permissionAncestors))){for(const key of directGrants(id)){if(!sources.has(key))sources.set(key,[]);sources.get(key).push(id)}}return sources}
function accountPermissions(member){const result=new Map();for(const [key,state] of Object.entries(personalOverrides(member))){if(state==='deny')result.delete(key);else result.set(key,['personal:'+member.id])}for(const [module] of permissionModules)if(!result.has(module+':0'))for(const key of [...result.keys()])if(key.startsWith(module+':'))result.delete(key);return result}
function personalOverrides(member){
const result={};
if(member.personalPermissionOverrides&&typeof member.personalPermissionOverrides==='object'){
for(const [key,state] of Object.entries(member.personalPermissionOverrides))if(validPermissionKey(key)&&['allow','deny'].includes(state))result[key]=state;
}else for(const key of Array.isArray(member.personalPermissions)?member.personalPermissions:[])if(validPermissionKey(key))result[key]='allow';
return result;
}
function validPermissionKey(key){return permissionModules.some(([m])=>permissionActions.some((_,i)=>key===m+':'+i))}
function setPersonalOverride(draft,key,state){
draft[key]=state;
const [module,action]=key.split(':');
if(action!=='0'&&state==='allow')draft[module+':0']='allow';
if(action==='0'&&state==='deny')for(const k of Object.keys(draft))if(k.startsWith(module+':'))draft[k]='deny';
}
function commitPersonalOverrides(member,draft){const updated={...member,personalPermissionOverrides:{...draft},lastOperationDate:today()};delete updated.personalPermissions;const members=data.members.map(m=>m.id===member.id?updated:m);try{persistAppData({...data,members})}catch{toast('保存失败，请重试；修改仍保留');return false}member.personalPermissionOverrides={...draft};member.lastOperationDate=updated.lastOperationDate;delete member.personalPermissions;return true}
function editPersonalPermissions(id){
const member=data.members.find(m=>m.id===id);if(!member)return;
let draft=personalOverrides(member);
openDialog('设置 '+member.name+' 个人权限',`<div id="personal-permission-matrix" class="table-scroll"></div>`, '<button class="btn" data-close>取消</button><button class="btn primary" id="save-personal-permissions">保存</button>');
$('#dialog').classList.add('personal-permission-dialog');$('#dialog').addEventListener('close',()=>$('#dialog').classList.remove('personal-permission-dialog'),{once:true});
function draw(){const effective=accountPermissions({...member,personalPermissionOverrides:draft});$('#personal-permission-matrix').innerHTML=`<table class="permission-matrix"><thead><tr><th scope="col">模块</th><th scope="col">功能</th>${permissionActions.filter((_,i)=>![4,5].includes(i)).map(action=>`<th scope="col">${action}</th>`).join('')}</tr></thead><tbody><tr><td>词库</td><th scope="row">基础词库</th>${permissionActions.flatMap((action,i)=>{if([4,5].includes(i))return [];return [[action,i]]}).map(([action,i])=>{const key='vocabulary:'+i;return `<td><input type="checkbox" data-personal-grant="${key}" aria-label="基础词库 ${action}" ${effective.has(key)?'checked':''}></td>`}).join('')}</tr></tbody></table>`;
$('#personal-permission-matrix').querySelectorAll('[data-personal-grant]').forEach(c=>c.onchange=()=>{const key=c.dataset.personalGrant;setPersonalOverride(draft,key,c.checked?'allow':'deny');draw();$('#personal-permission-matrix').querySelector(`[data-personal-grant="${key}"]`).focus()});
}
draw();$('#save-personal-permissions').onclick=()=>{if(commitPersonalOverrides(member,draft)){closeDialog();renderMembers();toast('个人权限已保存')}};
}

if(!data.personalPermissionsOnly){
 for(const member of data.members){
  const effective=permissionSources([COMPANY_ID,...(member.departments||[])]);
  for(const [key,state] of Object.entries(personalOverrides(member)))if(state==='deny')effective.delete(key);else effective.set(key,[]);
  for(const [module] of permissionModules)if(!effective.has(module+':0'))for(const key of [...effective.keys()])if(key.startsWith(module+':'))effective.delete(key);
  member.personalPermissionOverrides=Object.fromEntries([...effective.keys()].map(key=>[key,'allow']));
  delete member.personalPermissions;
 }
 data.personalPermissionsOnly=true;
 try{persistAppData(data)}catch{storageOK=false}
}
